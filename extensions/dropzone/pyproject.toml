[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-dropzone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["flet==1.1.2"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "robolab_dropzone",
    "flutter.robolab_dropzone",
    "flutter.robolab_dropzone.lib",
]

[tool.setuptools.package-data]
"flutter.robolab_dropzone" = ["pubspec.yaml"]
"flutter.robolab_dropzone.lib" = ["*.dart"]
