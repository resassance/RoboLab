[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-voice-android"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["flet==1.1.2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
packages = ["robolab_voice_android", "flutter.robolab_voice_android"]

[tool.setuptools.package-data]
"flutter.robolab_voice_android" = [
    "pubspec.yaml",
    "lib/*.dart",
    "android/build.gradle",
    "android/consumer-rules.pro",
    "android/src/main/AndroidManifest.xml",
    "android/src/main/java/io/github/resassance/robolab_voice_android/*.java",
]
